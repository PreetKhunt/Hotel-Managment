[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"
  # Force Netlify to ALWAYS trigger continuous deployment builds without silently skipping monorepo commits
  ignore = "false"

[build.environment]
  NETLIFY_USE_YARN = "false"
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/v1/*"
  to = "https://hotel-management-backend-s0s0.onrender.com/api/v1/:splat"
  status = 200
  force = true
